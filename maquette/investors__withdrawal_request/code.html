<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Withdraw Funds</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#d97706", // Marigold Orange
              "background-light": "#fef3c7", // Sand
              "background-dark": "#101922", // Deep Indigo/Charcoal
              "card-light": "#fffbeb",
              "card-dark": "#192633",
              "text-light": "#1f2937",
              "text-dark": "#e5e7eb",
              "text-muted-light": "#6b7280",
              "text-muted-dark": "#9ca3af",
              "border-light": "#e5e7eb",
              "border-dark": "#374151"
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "0.75rem", "xl": "1rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark">
<div class="relative flex h-auto min-h-screen w-full flex-col font-display group/design-root overflow-x-hidden antialiased">
<!-- TopAppBar -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10">
<div class="text-text-light dark:text-text-dark flex size-10 shrink-0 items-center justify-center">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</div>
<h2 class="text-text-light dark:text-text-dark text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Withdraw Funds</h2>
<div class="flex size-10 shrink-0 items-center"></div> <!-- Spacer -->
</div>
<div class="flex flex-col gap-6 p-4">
<!-- Card: Available Balance -->
<div class="flex items-center justify-between gap-4 rounded-xl bg-card-light dark:bg-card-dark p-4 shadow-sm">
<div class="flex flex-col gap-1">
<p class="text-text-muted-light dark:text-text-muted-dark text-sm font-medium leading-normal">Available to Withdraw</p>
<p class="text-green-600 dark:text-green-400 text-2xl font-bold leading-tight">KES 150,000.00</p>
</div>
<div class="flex size-14 shrink-0 items-center justify-center rounded-full bg-primary/10">
<div class="w-full bg-center bg-no-repeat aspect-square bg-contain" data-alt="Illustration of a wallet with coins" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDh6RHgowwOPN5TFOyRiCOQYLz9LeYT-sTDhoJNFSg5_7PzZIGsURM2v8ThJnctnHBd_Hucrcxr9AuIEVS1QmzrTLUcSnOnEjtvCzwjrRAMx1zsqcrKblfdKGIA2B8JrhCsAsE4RjxrwnzL0s0Q-ve2FhIKbG6exhlonGpMPisy2ooaGwJZvFpw94pMn3m3gFZCxb60MB-C2gpSEEauvUJj7sK1tECi81dPfVjjFX7ep3Ojy7FylIGJCrzBHk6YhfP6lLWVRWMcnPgi");'></div>
</div>
</div>
<!-- TextField: Amount -->
<div class="flex flex-col gap-2">
<label class="flex flex-col w-full">
<p class="text-text-light dark:text-text-dark text-base font-medium leading-normal pb-2">Amount</p>
<div class="flex w-full flex-1 items-stretch rounded-lg border border-border-light dark:border-border-dark focus-within:ring-2 focus-within:ring-primary">
<div class="text-text-muted-light dark:text-text-muted-dark flex items-center justify-center pl-4 bg-card-light dark:bg-card-dark rounded-l-lg">
<span class="font-bold">KES</span>
</div>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden text-text-light dark:text-text-dark focus:outline-0 focus:ring-0 border-0 bg-card-light dark:bg-card-dark h-14 placeholder:text-text-muted-light dark:placeholder:text-text-muted-dark p-4 text-lg font-normal leading-normal" placeholder="0.00" value="50,000.00"/>
<button class="text-primary flex items-center justify-center pr-4 font-bold bg-card-light dark:bg-card-dark rounded-r-lg text-sm">MAX</button>
</div>
</label>
</div>
<!-- ListItem: Payment Method Selector -->
<div class="flex items-center gap-4 bg-card-light dark:bg-card-dark rounded-xl p-3 justify-between shadow-sm cursor-pointer">
<div class="flex items-center gap-4">
<div class="flex items-center justify-center size-12 rounded-lg bg-green-500/10">
<div class="bg-center bg-no-repeat aspect-square bg-contain w-8" data-alt="M-PESA mobile money logo" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCwFdV2Cm5o6SMUYqI3-7qmXx46c-Ik_HOHQ4RgzY5e_KnFPOS7zyax0Vi5F68Gwftcs0uTlx6aGcaoVbECO-GqeAVvftnt5BySHdtblN4SoBQpV-KOClDc9ghzaSKkPPP_tRgTxmuYfqPW0hp-OdKLid_jcPqhlzuKDyQAz4hOuEFr6PU1YYDwlZ0r4QsxQlHtsFTL4H60YS-WspbiM7RL5sAwhoqGASLDrt8HUNcTwcTBqEsaN2fBPRJKT_5dd11eiRCb88t7CUu-");'></div>
</div>
<div class="flex flex-col justify-center">
<p class="text-text-muted-light dark:text-text-muted-dark text-sm font-normal leading-normal line-clamp-1">Withdraw to</p>
<p class="text-text-light dark:text-text-dark text-base font-medium leading-normal line-clamp-2">M-PESA ...1234</p>
</div>
</div>
<div class="shrink-0">
<div class="text-text-light dark:text-text-dark flex size-7 items-center justify-center">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- SectionHeader: Transaction Summary -->
<h3 class="text-text-light dark:text-text-dark text-lg font-bold leading-tight tracking-[-0.015em] pt-2">Transaction Summary</h3>
<!-- Summary Details -->
<div class="flex flex-col gap-3 rounded-xl bg-card-light dark:bg-card-dark p-4">
<div class="flex justify-between items-center text-text-muted-light dark:text-text-muted-dark">
<span>Withdrawal Amount</span>
<span class="text-text-light dark:text-text-dark">KES 50,000.00</span>
</div>
<div class="flex justify-between items-center text-text-muted-light dark:text-text-muted-dark">
<span>Processing Fee</span>
<span class="text-text-light dark:text-text-dark">KES 150.00</span>
</div>
<hr class="border-border-light dark:border-border-dark my-1"/>
<div class="flex justify-between items-center text-text-light dark:text-text-dark font-bold text-base">
<span>You will receive</span>
<span>KES 49,850.00</span>
</div>
</div>
</div>
<!-- Sticky Footer with CTA and Secondary Link -->
<div class="sticky bottom-0 mt-auto flex flex-col gap-4 bg-background-light dark:bg-background-dark p-4 border-t border-border-light dark:border-border-dark">
<!-- Primary CTA Button -->
<button class="flex items-center justify-center w-full rounded-xl bg-primary h-14 text-white text-base font-bold shadow-lg shadow-primary/30">
            Confirm Withdrawal
        </button>
<!-- Secondary Link/Button -->
<button class="flex items-center justify-center w-full text-primary font-medium text-sm">
            View Transaction History
        </button>
</div>
</div>
</body></html>
