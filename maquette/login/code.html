<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Super App</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#FF7B25",
                        "background-light": "#F7F7F7",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 24px;
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="font-display bg-background-light dark:bg-background-dark">
<div class="relative flex min-h-screen w-full flex-col items-center justify-center p-4">

<div class="flex justify-center">
<div class="flex h-16 w-16 items-center justify-center rounded-full bg-primary/20">
<span class="material-symbols-outlined text-4xl text-primary">hub</span>
</div>
</div>

<h1 class="font-display text-3xl font-bold tracking-tight text-slate-900 dark:text-white">Welcome Back</h1>
<p class="mt-2 font-display text-base text-slate-600 dark:text-slate-400">One App, All of Africa</p>
</div>
<!-- Input Fields -->
<div class="space-y-4">
<label class="flex flex-col">
<p class="font-display text-sm font-medium text-slate-700 dark:text-slate-300 pb-2">Email or Phone Number</p>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-slate-400 dark:text-slate-500">person</span>
<input class="form-input font-display h-14 w-full flex-1 resize-none overflow-hidden rounded-xl border border-slate-300 bg-white placeholder:text-slate-400 focus:border-primary focus:ring-primary/50 dark:border-slate-700 dark:bg-slate-800 dark:text-white dark:placeholder:text-slate-500 dark:focus:border-primary pl-12 pr-4 text-base font-normal leading-normal" placeholder="Enter your email or phone" value=""/>
</div>
</label>
<label class="flex flex-col">
<p class="font-display text-sm font-medium text-slate-700 dark:text-slate-300 pb-2">Password</p>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-slate-400 dark:text-slate-500">lock</span>
<input class="form-input font-display h-14 w-full flex-1 resize-none overflow-hidden rounded-xl border border-slate-300 bg-white placeholder:text-slate-400 focus:border-primary focus:ring-primary/50 dark:border-slate-700 dark:bg-slate-800 dark:text-white dark:placeholder:text-slate-500 dark:focus:border-primary pl-12 pr-12 text-base font-normal leading-normal" placeholder="Enter your password" type="password" value=""/>
<button class="absolute right-0 flex h-full w-12 items-center justify-center text-slate-400 dark:text-slate-500" data-icon="Eye" data-size="24px" data-weight="regular">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</label>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end">
<a class="font-display text-sm font-semibold text-primary hover:underline" href="#">Forgot Password?</a>
</div>
<!-- Primary CTA Button -->
<button class="flex h-14 w-full items-center justify-center rounded-xl bg-primary px-4 py-2 font-display text-base font-bold text-white transition-colors hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:ring-offset-2 dark:focus:ring-offset-background-dark">
                Log In
            </button>
<!-- Social Login Section -->
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-slate-200 dark:border-slate-700"></div>
<span class="mx-4 flex-shrink text-sm text-slate-500 dark:text-slate-400">Or log in with</span>
<div class="flex-grow border-t border-slate-200 dark:border-slate-700"></div>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="flex h-12 w-full items-center justify-center gap-2 rounded-xl border border-slate-300 bg-white px-4 py-2 font-display text-sm font-semibold text-slate-700 transition-colors hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-400/50 focus:ring-offset-2 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700/50 dark:focus:ring-offset-background-dark">
<img class="h-5 w-5" data-alt="Google G logo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDYHUjsA_jfXgS3QinoRN2KtIKcylx8eN-6JQhZ7vZu6nHpHRxV4CEb153xewrSnvIEhoAkbtB7EVo6DUFLiI1ECgdvqA7gcPDIb2--77NBkkiKROHQ3O8GzOzUY0rEIwQ5s_Oy0q2KLsha-crizt_QsAdWo5NL0uBFE6_hEr_yWwnvXXfLYUm5DAhSSPOyqllGwXqfaxV8RGTinitjocOtq3_9m9j1lJSp3K0_ANXrTyZFcv_pwWJkZJVbkQ6a8o5BdgbVgXz3oyrl"/>

                </button>
<button class="flex h-12 w-full items-center justify-center gap-2 rounded-xl border border-slate-300 bg-white px-4 py-2 font-display text-sm font-semibold text-slate-700 transition-colors hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-400/50 focus:ring-offset-2 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700/50 dark:focus:ring-offset-background-dark">
<img class="h-5 w-5 dark:invert" data-alt="Apple logo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCOPzpF0Tt9A-uQNjVUFlBJe-bQi-4C2g1O1IAe4viWSlEUudt8qqMyQQp5eamODwBdmwkTwmIr1Hsnl3BFjaE3OcV_yxNC9fFRgwhErOMoQ18_8S7TIhRy6bqUIQdsunSXucbVrptBhS34OX8T6fhUf_y56FETJHFHWdc1nPXsOSVhUjZlYiKK5jKJnV6KMcNvEwRsROQBMORGz2b4hW1ULha1wbX9uDeyQ2_Wuqs1simgfBW-UC0FqhgYI_DO3DaFV2_SrJHZ7Xhk"/>
                    Apple
                </button>
</div>
<!-- Sign-Up Link -->
<div class="pt-4 text-center">
<p class="font-display text-sm text-slate-600 dark:text-slate-400">
                    Don't have an account? <a class="font-bold text-primary hover:underline" href="#">Sign Up</a>
</p>
</div>
</div>
</div>
</body></html>
