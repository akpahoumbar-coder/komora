<!DOCTYPE html>

<script id="tailwind-config">

        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#137fec",
              "background-light": "#f6f7f8",
              "background-dark": "#101922",

            fontFamily: {

          'GRAD' 0,

<style>

</button>
</div>
</div>

<p class="text-zinc-900 dark:text-white text-base font-medium leading-normal">Thinking...</p>
<div class="rounded-full bg-zinc-300 dark:bg-[#324d67]">
<div class="h-2 rounded-full bg-primary" style="width: 75%; animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;"></div>
</div>
</div>
</div>
</div>
</div>

<button class="p-2 text-zinc-600 dark:text-zinc-400 hover:text-primary dark:hover:text-primary">
