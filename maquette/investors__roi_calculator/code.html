<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ROI Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#137fec",
              "background-light": "#f6f7f8",
              "background-dark": "#101922",
              "accent": "#f59e0b", /* Sunset Orange/Bright Yellow */
              "text-light": "#1f2937",
              "text-dark": "#e5e7eb",
              "text-light-secondary": "#6b7280",
              "text-dark-secondary": "#9ca3af",
              "card-light": "#ffffff",
              "card-dark": "#1a2633",
              "border-light": "#e5e7eb",
              "border-dark": "#374151"
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "0.75rem", "xl": "1rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark">
<div class="relative flex min-h-screen w-full flex-col">
<!-- TopAppBar -->
<header class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10">
<button class="text-text-light dark:text-text-dark flex size-10 shrink-0 items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-text-light dark:text-text-dark text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">ROI Calculator</h1>
<div class="size-10 shrink-0"></div> <!-- Spacer -->
</header>
<main class="flex flex-col gap-6 p-4">
<!-- Input Card -->
<div class="bg-card-light dark:bg-card-dark rounded-xl p-4 flex flex-col gap-5">
<!-- TextField: Investment Amount -->
<div class="flex flex-col">
<label class="text-text-light dark:text-text-dark text-base font-medium leading-normal pb-2" for="investment-amount">Investment Amount</label>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-0 focus:ring-2 focus:ring-accent border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark h-14 placeholder:text-text-light-secondary dark:placeholder:text-text-dark-secondary p-4 text-base font-normal leading-normal" id="investment-amount" placeholder="KES 100,000" value=""/>
</div>
<!-- SegmentedButtons: Investment Plan -->
<div class="flex flex-col">
<p class="text-text-light dark:text-text-dark text-base font-medium leading-normal pb-2">Choose Your Plan</p>
<div class="flex h-12 flex-1 items-center justify-center rounded-lg bg-background-light dark:bg-background-dark p-1">
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-md px-2 text-center has-[:checked]:bg-primary has-[:checked]:text-white text-text-light-secondary dark:text-text-dark-secondary text-sm font-medium leading-normal transition-colors duration-200">
<span class="truncate">Stable Growth</span>
<input class="invisible w-0" name="investment-plan" type="radio" value="Stable Growth"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-md px-2 text-center has-[:checked]:bg-primary has-[:checked]:text-white text-text-light-secondary dark:text-text-dark-secondary text-sm font-medium leading-normal transition-colors duration-200">
<span class="truncate">Balanced</span>
<input checked="" class="invisible w-0" name="investment-plan" type="radio" value="Balanced"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-md px-2 text-center has-[:checked]:bg-primary has-[:checked]:text-white text-text-light-secondary dark:text-text-dark-secondary text-sm font-medium leading-normal transition-colors duration-200">
<span class="truncate">High Yield</span>
<input class="invisible w-0" name="investment-plan" type="radio" value="High Yield"/>
</label>
</div>
</div>
<!-- Slider: Investment Duration -->
<div class="@container">
<div class="relative flex w-full flex-col items-start justify-between gap-3">
<div class="flex w-full shrink-[3] items-center justify-between">
<p class="text-text-light dark:text-text-dark text-base font-medium leading-normal">Investment Duration</p>
<p class="text-primary text-base font-bold leading-normal">3 years</p>
</div>
<div class="flex h-4 w-full items-center gap-4">
<div class="relative flex h-2 flex-1 items-center">
<div class="h-full w-full rounded-full bg-background-light dark:bg-background-dark border border-border-light dark:border-border-dark"></div>
<div class="absolute h-full w-[40%] rounded-full bg-primary"></div>
<div class="absolute w-[40%] h-full flex items-center justify-end">
<div class="size-5 rounded-full bg-white dark:bg-card-light shadow-md border-2 border-primary"></div>
</div>
</div>
</div>
</div>
</div>
</div>
<!-- Results Display Card -->
<div class="bg-card-light dark:bg-card-dark rounded-xl p-5 flex flex-col gap-6">
<!-- HeadlineText: Projected Return -->
<div class="text-center">
<h2 class="text-text-light-secondary dark:text-text-dark-secondary text-base font-medium">Projected Return</h2>
<p class="text-text-light dark:text-text-dark text-5xl font-bold leading-tight tracking-tighter">KES 140,580</p>
</div>
<!-- Data Breakdown -->
<div class="flex flex-col gap-3">
<div class="flex justify-between items-center">
<p class="text-text-light-secondary dark:text-text-dark-secondary text-sm">Initial Investment</p>
<p class="text-text-light dark:text-text-dark text-sm font-medium">KES 100,000</p>
</div>
<div class="flex justify-between items-center">
<p class="text-text-light-secondary dark:text-text-dark-secondary text-sm">Projected Earnings</p>
<p class="text-green-500 text-sm font-medium">+ KES 40,580</p>
</div>
<hr class="border-border-light dark:border-border-dark my-1"/>
<div class="flex justify-between items-center">
<p class="text-text-light dark:text-text-dark text-sm font-semibold">Total Potential Value</p>
<p class="text-text-light dark:text-text-dark text-sm font-semibold">KES 140,580</p>
</div>
</div>
<!-- Interactive Chart -->
<div>
<h3 class="text-text-light dark:text-text-dark text-base font-medium mb-4">Growth Over Time</h3>
<div class="h-40 w-full flex items-end gap-2 border-l border-b border-border-light/50 dark:border-border-dark/50 pl-2 pb-2">
<!-- Chart Bars -->
<div class="flex-1 h-[30%] bg-primary/20 dark:bg-primary/30 rounded-t-sm" data-alt="Year 1 investment growth bar"></div>
<div class="flex-1 h-[60%] bg-primary/20 dark:bg-primary/30 rounded-t-sm" data-alt="Year 2 investment growth bar"></div>
<div class="flex-1 h-full bg-primary rounded-t-sm" data-alt="Year 3 investment growth bar"></div>
</div>
</div>
</div>
</main>
<!-- Sticky Footer with CTA and Disclaimer -->
<footer class="sticky bottom-0 mt-auto bg-card-light dark:bg-card-dark p-4 border-t border-border-light dark:border-border-dark">
<div class="flex flex-col gap-3">
<button class="w-full bg-accent text-white font-bold py-4 px-4 rounded-lg text-base h-14 flex items-center justify-center hover:bg-amber-600 transition-colors">
                    Get Started with Investing
                </button>
<p class="text-text-light-secondary dark:text-text-dark-secondary text-xs text-center">Estimates are for illustrative purposes only and not a guarantee of future returns.</p>
</div>
</footer>
</div>
</body></html>
