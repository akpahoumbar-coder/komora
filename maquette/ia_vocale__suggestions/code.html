<!DOCTYPE html>

            "display": ["Inter", "sans-serif"]

          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "0.75rem",
            "xl": "1rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<p class="text-base font-normal leading-normal flex max-w-[360px] rounded-lg px-4 py-3 bg-card-light dark:bg-card-dark text-text-light dark:text-text-dark">Here is the current stock information for Safaricom PLC (SCOM).</p>
</div>
</div>
</div>

<div class="flex flex-wrap gap-4 px-4 py-2">
<div class="flex w-full flex-1 flex-col gap-4 rounded-xl border border-subtle-light dark:border-subtle-dark bg-card-light dark:bg-card-dark p-6 shadow-sm">

<p class="text-text-light dark:text-text-dark tracking-light text-[32px] font-bold leading-tight truncate">Ksh 16.50</p>
<div class="flex gap-1">

<p class="text-green-500 text-base font-medium leading-normal">+0.25%</p>

</div>

<div class="flex justify-around">
<p class="text-text-light/70 dark:text-text-dark/70 text-[13px] font-bold leading-normal tracking-[0.015em]">9am</p>
<p class="text-text-light/70 dark:text-text-dark/70 text-[13px] font-bold leading-normal tracking-[0.015em]">12pm</p>
<p class="text-text-light/70 dark:text-text-dark/70 text-[13px] font-bold leading-normal tracking-[0.015em]">3pm</p>
<p class="text-text-light/70 dark:text-text-dark/70 text-[13px] font-bold leading-normal tracking-[0.015em]">6pm</p>
</div>
</div>
<button class="w-full rounded-lg bg-primary/20 dark:bg-primary/30 py-3 text-base font-bold text-primary dark:text-secondary">View Full Analysis</button>
</div>
</div>
<!-- Suggested Actions Section -->
<div class="px-4">
<h3 class="text-text-light dark:text-text-dark text-lg font-bold leading-tight tracking-[-0.015em] pb-2 pt-4">Suggested Actions</h3>
<div class="flex flex-col gap-3">
<button class="flex w-full items-center justify-center rounded-lg border border-subtle-light dark:border-subtle-dark bg-card-light dark:bg-card-dark px-4 py-3 text-center text-base font-medium text-text-light dark:text-text-dark shadow-sm">Set a price alert</button>
<button class="flex w-full items-center justify-center rounded-lg border border-subtle-light dark:border-subtle-dark bg-card-light dark:bg-card-dark px-4 py-3 text-center text-base font-medium text-text-light dark:text-text-dark shadow-sm">Compare with other telcos</button>
<button class="flex w-full items-center justify-center rounded-lg border border-subtle-light dark:border-subtle-dark bg-card-light dark:bg-card-dark px-4 py-3 text-center text-base font-medium text-text-light dark:text-text-dark shadow-sm">Add to my watchlist</button>

<!-- Floating Action Button -->
<div class="fixed bottom-6 right-6 z-20">
<button class="flex h-16 w-16 items-center justify-center rounded-full bg-secondary shadow-lg">

</button>
</div>
