<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Select Language</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24;
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#FF7A00",
              "background-light": "#F9F9F9",
              "background-dark": "#101622",
              "content-light": "#FFFFFF",
              "content-dark": "#182131",
              "text-primary-light": "#333333",
              "text-primary-dark": "#FFFFFF",
              "text-secondary-light": "#666666",
              "text-secondary-dark": "#92a4c9",
              "border-light": "#E0E0E0",
              "border-dark": "#324467"
            },
            fontFamily: {
              "display": ["Manrope", "sans-serif"]
            },
            borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark">
<div class="relative flex h-screen w-full flex-col group/design-root overflow-hidden">
<!-- Top App Bar -->
<header class="sticky top-0 z-10 bg-background-light dark:bg-background-dark px-4 pt-4 pb-2">
<div class="flex items-center justify-between">
<button class="text-text-primary-light dark:text-text-primary-dark flex size-10 items-center justify-center rounded-full">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-text-primary-light dark:text-text-primary-dark text-lg font-bold">Select Language</h1>
<div class="size-10"></div> <!-- Spacer -->
</div>
</header>
<!-- Search Bar -->
<div class="sticky top-[72px] z-10 bg-background-light dark:bg-background-dark px-4 pb-4 pt-2">
<label class="flex flex-col h-12 w-full">
<div class="flex w-full flex-1 items-stretch rounded-xl h-full">
<div class="text-text-secondary-light dark:text-text-secondary-dark flex bg-content-light dark:bg-content-dark items-center justify-center pl-4 rounded-l-xl border-y border-l border-border-light dark:border-border-dark">
<span class="material-symbols-outlined text-2xl">search</span>
</div>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-r-xl text-text-primary-light dark:text-text-primary-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border-y border-r border-border-light dark:border-border-dark bg-content-light dark:bg-content-dark h-full placeholder:text-text-secondary-light dark:placeholder:text-text-secondary-dark px-4 pl-2 text-base font-normal" placeholder="Search language..."/>
</div>
</label>
</div>
<!-- Language List -->
<main class="flex-1 overflow-y-auto px-4 pb-28">
<fieldset class="flex flex-col gap-2">
<legend class="sr-only">Language Selection</legend>
<!-- List Item - Selected -->
<label class="flex items-center gap-4 bg-primary/10 dark:bg-primary/20 p-4 min-h-[72px] justify-between rounded-xl border border-primary">
<div class="flex flex-col justify-center">
<p class="text-text-primary-light dark:text-text-primary-dark text-base font-bold leading-normal">English</p>
</div>
<div class="shrink-0">
<div class="flex size-6 items-center justify-center rounded-full bg-primary">
<input checked="" class="sr-only" name="language" type="radio" value="english"/>
<span class="material-symbols-outlined text-white text-base">check</span>
</div>
</div>
</label>
<!-- List Item -->
<label class="flex items-center gap-4 bg-content-light dark:bg-content-dark p-4 min-h-[72px] justify-between rounded-xl border border-transparent has-[:checked]:border-primary has-[:checked]:bg-primary/10 dark:has-[:checked]:bg-primary/20">
<div class="flex flex-col justify-center">
<p class="text-text-primary-light dark:text-text-primary-dark text-base font-medium leading-normal">Français</p>
<p class="text-text-secondary-light dark:text-text-secondary-dark text-sm font-normal leading-normal">French</p>
</div>
<div class="shrink-0">
<div class="flex size-6 items-center justify-center rounded-full border-2 border-border-light dark:border-border-dark group-has-[:checked]:bg-primary group-has-[:checked]:border-primary">
<input class="sr-only" name="language" type="radio" value="french"/>
<span class="material-symbols-outlined text-white text-base hidden group-has-[:checked]:inline">check</span>
</div>
</div>
</label>
<!-- List Item -->
<label class="flex items-center gap-4 bg-content-light dark:bg-content-dark p-4 min-h-[72px] justify-between rounded-xl border border-transparent has-[:checked]:border-primary has-[:checked]:bg-primary/10 dark:has-[:checked]:bg-primary/20 group">
<div class="flex flex-col justify-center">
<p class="text-text-primary-light dark:text-text-primary-dark text-base font-medium leading-normal">Kiswahili</p>
<p class="text-text-secondary-light dark:text-text-secondary-dark text-sm font-normal leading-normal">Swahili</p>
</div>
<div class="shrink-0">
<div class="flex size-6 items-center justify-center rounded-full border-2 border-border-light dark:border-border-dark group-has-[:checked]:bg-primary group-has-[:checked]:border-primary">
<input class="sr-only" name="language" type="radio" value="swahili"/>
<span class="material-symbols-outlined text-white text-base hidden group-has-[:checked]:inline">check</span>
</div>
</div>
</label>
<!-- List Item -->
<label class="flex items-center gap-4 bg-content-light dark:bg-content-dark p-4 min-h-[72px] justify-between rounded-xl border border-transparent has-[:checked]:border-primary has-[:checked]:bg-primary/10 dark:has-[:checked]:bg-primary/20 group">
<div class="flex flex-col justify-center">
<p class="text-text-primary-light dark:text-text-primary-dark text-base font-medium leading-normal">العربية</p>

<input class="sr-only" name="language" type="radio" value="arabic"/>
<span class="material-symbols-outlined text-white text-base hidden group-has-[:checked]:inline">check</span>
</div>
</div>
</label>

<div class="flex flex-col justify-center">
<p class="text-text-primary-light dark:text-text-primary-dark text-base font-medium leading-normal">Português</p>
<p class="text-text-secondary-light dark:text-text-secondary-dark text-sm font-normal leading-normal">Portuguese</p>
</div>
<div class="shrink-0">
<div class="flex size-6 items-center justify-center rounded-full border-2 border-border-light dark:border-border-dark group-has-[:checked]:bg-primary group-has-[:checked]:border-primary">
<input class="sr-only" name="language" type="radio" value="portuguese"/>
<span class="material-symbols-outlined text-white text-base hidden group-has-[:checked]:inline">check</span>
</div>
</div>
</label>

<label class="flex items-center gap-4 bg-content-light dark:bg-content-dark p-4 min-h-[72px] justify-between rounded-xl border border-transparent has-[:checked]:border-primary has-[:checked]:bg-primary/10 dark:has-[:checked]:bg-primary/20 group">
<div class="flex flex-col justify-center">

<p class="text-text-secondary-light dark:text-text-secondary-dark text-sm font-normal leading-normal">Hausa</p>

</div>

<div class="flex flex-col justify-center">
<p class="text-text-primary-light dark:text-text-primary-dark text-base font-medium leading-normal">Yorùbá</p>
<p class="text-text-secondary-light dark:text-text-secondary-dark text-sm font-normal leading-normal">Yoruba</p>
</div>

<div class="flex flex-col justify-center">
<p class="text-text-primary-light dark:text-text-primary-dark text-base font-medium leading-normal">Igbo</p>

<span class="material-symbols-outlined text-white text-base hidden group-has-[:checked]:inline">check</span>
</div>
</div>
</label>
</fieldset>
</main>
<!-- CTA Button -->
<div class="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-background-light dark:from-background-dark to-transparent">
<button class="w-full h-14 bg-primary text-white font-bold text-base rounded-xl flex items-center justify-center">
                 Confirm Selection
             </button>
</div>
</div>
</body></html>
