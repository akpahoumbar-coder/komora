<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Shopping Cart</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    .material-symbols-outlined {
      font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24;
      font-size: 24px;
    }
  </style>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#eea62b",
            "background-light": "#f8f7f6",
            "background-dark": "#221b10",
          },
          fontFamily: {
            "display": ["Plus Jakarta Sans", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "1rem",
            "xl": "1.5rem",

          },
        },

    }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

</button>
</div>

<div class="flex w-12 items-center justify-end">
</div>

</div>

<span class="material-symbols-outlined !text-xl">delete</span>
</button>
<div class="flex items-center gap-2 text-slate-900 dark:text-white">
<button class="text-base font-medium leading-normal flex h-7 w-7 items-center justify-center rounded-full bg-slate-200 dark:bg-[#483a23] cursor-pointer">-</button>
<span class="text-base font-medium leading-normal w-4 text-center">1</span>
<button class="text-base font-medium leading-normal flex h-7 w-7 items-center justify-center rounded-full bg-slate-200 dark:bg-[#483a23] cursor-pointer">+</button>
</div>
</div>
</div>
<!-- List Item 2 -->
<div class="flex gap-4 bg-background-light dark:bg-background-dark py-3 justify-between items-center border-b border-slate-200 dark:border-white/10">

<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-lg size-[70px]" data-alt="Close up of a colorful beaded Maasai necklace" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuB1iG-BElvkI97BaNrhiyhh2OgLUbJ06r7LyxmYv2su_qd8YbnUuUGO6lNctKrTucO9-NR3fv25NKW5cTb2M8BZAUvmuRY73lzLk7D1MW0DXOQphQ5wtc8HczemG0oC4lv-Da36rq_pFwlBDw1asA8q-Z57Zxx6TGJCSrcOX3zDl5Fa9Nlx_q1NqYigsU0cfB6NE0cRkKBynX6c-iRxUoayNFgBYPoPpPZzTOewj3T1gOChy1vmLo-azlIN2JPnuGOtR8p6Pdx8kIHd");'></div>
<div class="flex flex-1 flex-col justify-center gap-1">
<p class="text-slate-900 dark:text-white text-base font-medium leading-normal">Beaded Maasai Necklace</p>
<p class="text-slate-500 dark:text-[#c9b592] text-sm font-normal leading-normal">Color: Red Multi</p>
<p class="text-slate-900 dark:text-white text-base font-semibold leading-normal mt-1">$25.00</p>
</div>
</div>
<div class="shrink-0 flex flex-col items-end justify-between self-stretch">
<button class="p-1 text-slate-500 dark:text-gray-400">
<span class="material-symbols-outlined !text-xl">delete</span>
</button>
<div class="flex items-center gap-2 text-slate-900 dark:text-white">
<button class="text-base font-medium leading-normal flex h-7 w-7 items-center justify-center rounded-full bg-slate-200 dark:bg-[#483a23] cursor-pointer">-</button>
<span class="text-base font-medium leading-normal w-4 text-center">1</span>
<button class="text-base font-medium leading-normal flex h-7 w-7 items-center justify-center rounded-full bg-slate-200 dark:bg-[#483a23] cursor-pointer">+</button>
</div>
</div>
</div>
<!-- List Item 3 -->
<div class="flex gap-4 bg-background-light dark:bg-background-dark py-3 justify-between items-center border-b border-slate-200 dark:border-white/10">
<div class="flex items-start gap-4">
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-lg size-[70px]" data-alt="A pair of handmade brown leather sandals" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBHAWIwbNlUdHE0uBpq9z7i7KVicSDBWcmWPVMGZ_sot_Zm8ViFrXNIRULoTh_UANqN4XwyzGXOIaq3sZ2jYFKMPf-BScPinLzzpuFizm5Ew592ERYw8BaQ72hazdSHw532U-6D0Uv2P_ZXYK2kWbmRUeYi3dmOicL_JCSmHh3mPQShcB8aF_XpfAZjZw8n_2X03rKZpfdbomCNV9eUJZF1poCDwhgdxAbJnsp-GtZMXzX8qFVlLNkmbVbxJfemX1h0ld4EDT_dv-JU");'></div>
<div class="flex flex-1 flex-col justify-center gap-1">
<p class="text-slate-900 dark:text-white text-base font-medium leading-normal">Leather Sandals</p>
<p class="text-slate-500 dark:text-[#c9b592] text-sm font-normal leading-normal">Size: 42, Color: Brown</p>
<p class="text-slate-900 dark:text-white text-base font-semibold leading-normal mt-1">$35.00</p>
</div>
</div>
<div class="shrink-0 flex flex-col items-end justify-between self-stretch">
<button class="p-1 text-slate-500 dark:text-gray-400">

</button>
<div class="flex items-center gap-2 text-slate-900 dark:text-white">
<button class="text-base font-medium leading-normal flex h-7 w-7 items-center justify-center rounded-full bg-slate-200 dark:bg-[#483a23] cursor-pointer">-</button>
<span class="text-base font-medium leading-normal w-4 text-center">1</span>
<button class="text-base font-medium leading-normal flex h-7 w-7 items-center justify-center rounded-full bg-slate-200 dark:bg-[#483a23] cursor-pointer">+</button>
</div>
</div>
</div>
</div>

<div class="flex w-full flex-1 items-stretch rounded-xl">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-[#675332] bg-white dark:bg-[#332a19] focus:border-primary h-14 placeholder:text-slate-400 dark:placeholder:text-[#c9b592] p-[15px] rounded-r-none border-r-0 pr-2 text-base font-normal leading-normal" placeholder="Enter promo code" value=""/>
<button class="text-slate-600 dark:text-[#c9b592] flex border border-slate-300 dark:border-[#675332] bg-white dark:bg-[#332a19] items-center justify-center px-[15px] rounded-r-xl border-l-0 hover:bg-slate-50 dark:hover:bg-primary/10">
              Apply
            </button>
</div>
</label>
</div>
</main>
<!-- Sticky Footer -->
<footer class="fixed bottom-0 left-0 right-0 w-full bg-background-light dark:bg-background-dark border-t border-slate-200 dark:border-white/10 p-4 shadow-[0_-4px_30px_rgba(0,0,0,0.1)] dark:shadow-[0_-4px_30px_rgba(0,0,0,0.4)] rounded-t-xl">
<div class="flex flex-col gap-3">
<div class="flex justify-between items-center text-slate-600 dark:text-gray-300">
<span>Subtotal</span>
<span class="font-medium text-slate-900 dark:text-white">$105.00</span>
</div>
<div class="flex justify-between items-center text-slate-600 dark:text-gray-300">
<div class="flex items-center gap-1">
<span>Delivery Fee</span>
<span class="material-symbols-outlined !text-base">info</span>
</div>
<span class="font-medium text-slate-900 dark:text-white">$10.00</span>
</div>
<div class="border-t border-dashed border-slate-300 dark:border-white/20 my-2"></div>
<div class="flex justify-between items-center">
<span class="text-slate-600 dark:text-gray-300">Total</span>
<span class="text-xl font-bold text-slate-900 dark:text-white">$115.00</span>
</div>
</div>
<button class="mt-4 flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 bg-primary text-slate-900 gap-2 text-base font-bold leading-normal tracking-[0.015em]">
        Proceed to Checkout
      </button>
</footer>
</div>
