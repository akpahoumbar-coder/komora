<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AI Voice Assistant</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<!-- Top App Bar -->
<header class="flex items-center p-4 justify-between w-full">
<div class="flex size-12 shrink-0 items-center">
<!-- Intentionally left blank for minimalist design -->
</div>
<div class="flex w-12 items-center justify-end">
<button class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-10 w-10 bg-transparent text-white/80 hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-2xl">close</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="flex flex-col items-center justify-center flex-grow px-4 pt-4 pb-8">
<div class="flex-grow flex flex-col justify-center items-center w-full">
<!-- Headline Text -->
<h1 class="text-white tracking-tight text-[32px] font-bold leading-tight text-center pb-3">Hello, User. How can I assist you today?</h1>
<!-- Chips for suggestions -->
<div class="flex gap-3 p-3 flex-wrap justify-center">
<div class="flex h-8 shrink-0 cursor-pointer items-center justify-center gap-x-2 rounded-lg bg-white/10 hover:bg-white/20 transition-colors px-4">
<p class="text-white text-sm font-medium leading-normal">Track my order</p>
</div>
<div class="flex h-8 shrink-0 cursor-pointer items-center justify-center gap-x-2 rounded-lg bg-white/10 hover:bg-white/20 transition-colors px-4">
<p class="text-white text-sm font-medium leading-normal">Buy airtime</p>
</div>
<div class="flex h-8 shrink-0 cursor-pointer items-center justify-center gap-x-2 rounded-lg bg-white/10 hover:bg-white/20 transition-colors px-4">
<p class="text-white text-sm font-medium leading-normal">Check my portfolio</p>
</div>
</div>
</div>
<!-- Visualizer/Waveform Placeholder -->
<div class="flex w-full items-center justify-center py-10 h-32">
<div class="w-full max-w-sm flex items-center justify-between">
<div class="h-2 w-1 rounded-full bg-primary/20"></div>
<div class="h-4 w-1 rounded-full bg-primary/30"></div>
<div class="h-6 w-1 rounded-full bg-primary/40"></div>
<div class="h-3 w-1 rounded-full bg-primary/20"></div>
<div class="h-5 w-1 rounded-full bg-primary/30"></div>
<div class="h-8 w-1 rounded-full bg-primary/50"></div>
<div class="h-4 w-1 rounded-full bg-primary/30"></div>
<div class="h-10 w-1 rounded-full bg-primary/70"></div>
<div class="h-12 w-1 rounded-full bg-primary"></div>
<div class="h-9 w-1 rounded-full bg-primary/60"></div>
<div class="h-5 w-1 rounded-full bg-primary/30"></div>
<div class="h-10 w-1 rounded-full bg-primary/70"></div>
<div class="h-8 w-1 rounded-full bg-primary/50"></div>
<div class="h-4 w-1 rounded-full bg-primary/30"></div>
<div class="h-7 w-1 rounded-full bg-primary/40"></div>
<div class="h-3 w-1 rounded-full bg-primary/20"></div>
<div class="h-5 w-1 rounded-full bg-primary/30"></div>
<div class="h-9 w-1 rounded-full bg-primary/60"></div>
<div class="h-11 w-1 rounded-full bg-primary/80"></div>
<div class="h-12 w-1 rounded-full bg-primary"></div>
<div class="h-10 w-1 rounded-full bg-primary/70"></div>
<div class="h-8 w-1 rounded-full bg-primary/50"></div>
<div class="h-5 w-1 rounded-full bg-primary/30"></div>
<div class="h-3 w-1 rounded-full bg-primary/20"></div>
<div class="h-6 w-1 rounded-full bg-primary/40"></div>
<div class="h-4 w-1 rounded-full bg-primary/30"></div>
<div class="h-2 w-1 rounded-full bg-primary/20"></div>
</div>
</div>
<!-- Body Text -->
<p class="text-white/70 text-base font-normal leading-normal pb-6 pt-1 text-center">Tap the mic to start</p>
</main>
<!-- FAB (Floating Action Button) -->
<footer class="flex justify-center overflow-hidden px-5 pb-8 pt-4">
<button class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-20 w-20 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] shadow-lg shadow-primary/30">
<span class="material-symbols-outlined text-4xl">mic</span>
</button>
</footer>
</div>
</body></html>
