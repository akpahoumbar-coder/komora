<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Courier Delivery Tracking</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#13ec5b",
              "background-light": "#f6f8f6",
              "background-dark": "#102216",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-screen w-full flex-col group/design-root overflow-hidden">
<!-- Top App Bar -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 z-20">
<div class="flex size-10 shrink-0 items-center justify-center">
<span class="material-symbols-outlined text-zinc-900 dark:text-zinc-100 text-2xl">arrow_back</span>
</div>
<h2 class="text-zinc-900 dark:text-zinc-100 text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Current Delivery</h2>
<div class="flex w-10 items-center justify-end">
<button class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 bg-transparent text-zinc-900 dark:text-zinc-100 gap-2 text-base font-bold leading-normal tracking-[0.015em] min-w-0 p-0">
<span class="material-symbols-outlined text-2xl">more_vert</span>
</button>
</div>
</div>
<!-- Map View -->
<div class="absolute inset-0 z-0 h-full w-full">
<div class="@container flex flex-col h-full flex-1">
<div class="flex flex-1 flex-col">
<div class="bg-cover bg-center flex flex-1 flex-col justify-end" data-alt="A desaturated map view of a city grid with a highlighted route." style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDOkCjaQQeWvrSbQ_a7eaBR4aZGAKL_ifo7F7VTPPE2EhUzNwf1tX39KcZ1YFS5VgyGkHszVRuMQda5oErkFxauvTx938oKHfG18-M7huvtpWwINbXoidR-1EDyUKqgdDHgYdu5ojjT_9NuJkdT0tYstJiwV_Es2EScWf4tqcEeHczKBBJgDh99q_fZJRWiIIo9-XCczUf6KxBUw9rtDjcvdn4s_zTZRbt7lfHSN8y9XfQuLytwPU5Pfz_tACVVWV290jIKE9HIIgsm");'>
<div class="flex flex-col items-end gap-3 p-4">
<button class="flex size-12 items-center justify-center rounded-full bg-zinc-800/80 backdrop-blur-sm shadow-lg">
<span class="material-symbols-outlined text-white text-2xl">navigation</span>
</button>
</div>
</div>
</div>
</div>
</div>
<!-- Bottom Sheet Content -->
<div class="relative z-10 mt-auto flex flex-col">
<div class="bg-background-light dark:bg-background-dark rounded-t-xl shadow-[0_-10px_30px_-15px_rgba(0,0,0,0.3)]">
<!-- Handle -->
<div class="w-full flex justify-center py-3">
<div class="w-10 h-1.5 bg-zinc-300 dark:bg-zinc-700 rounded-full"></div>
</div>
<!-- Order Info -->
<div class="flex items-start gap-4 px-4 pb-4 border-b border-zinc-200 dark:border-zinc-800">
<div class="text-zinc-900 dark:text-zinc-100 flex items-center justify-center rounded-lg bg-primary/20 shrink-0 size-12">
<span class="material-symbols-outlined text-primary text-3xl">local_shipping</span>
</div>
<div class="flex flex-col justify-center flex-1">
<p class="text-zinc-900 dark:text-white text-base font-bold leading-normal line-clamp-1">Order #AB-123456</p>
<p class="text-zinc-600 dark:text-zinc-400 text-sm font-normal leading-normal line-clamp-2">Jelani Okoro, 123 Adetokunbo St</p>
</div>
<div class="shrink-0">
<button class="text-primary text-sm font-bold leading-normal">Details</button>
</div>
</div>
<!-- Progress Bar -->
<div class="flex flex-col gap-2 p-4">
<div class="flex justify-between">
<p class="text-zinc-900 dark:text-white text-base font-medium leading-normal">En Route to Customer</p>
<p class="text-zinc-600 dark:text-zinc-400 text-sm font-normal leading-normal">2 stops left</p>
</div>
<div class="rounded-full bg-primary/20">
<div class="h-2 rounded-full bg-primary" style="width: 66%;"></div>
</div>
<p class="text-zinc-600 dark:text-zinc-400 text-sm font-normal leading-normal">ETA: 12 min | 3.5 km remaining</p>
</div>
<!-- Action Buttons -->
<div class="grid grid-cols-2 gap-4 p-4">
<button class="flex flex-col items-center justify-center gap-2 rounded-xl bg-zinc-200 dark:bg-zinc-800 p-4 h-24">
<span class="material-symbols-outlined text-zinc-900 dark:text-zinc-100 text-2xl">call</span>
<span class="text-zinc-900 dark:text-zinc-100 text-sm font-medium">Call Customer</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 rounded-xl bg-zinc-200 dark:bg-zinc-800 p-4 h-24">
<span class="material-symbols-outlined text-zinc-900 dark:text-zinc-100 text-2xl">chat</span>
<span class="text-zinc-900 dark:text-zinc-100 text-sm font-medium">Message</span>
</button>
</div>
<!-- Main CTA -->
<div class="px-4 pb-6 pt-2">
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 bg-primary text-background-dark text-base font-bold leading-normal tracking-[0.015em] min-w-0 px-6 gap-2">
<span>Slide to Confirm Arrival</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</div>
</div>
</div>
</body></html>
