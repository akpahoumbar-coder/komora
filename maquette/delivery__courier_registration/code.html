<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Courier Registration</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
    .material-symbols-outlined {
      font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
    }
  </style>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#137fec",
            "background-light": "#f6f7f8",
            "background-dark": "#101922",
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden">
<!-- TopAppBar -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10">
<div class="text-slate-800 dark:text-white flex size-12 shrink-0 items-center">
<span class="material-symbols-outlined !text-2xl">arrow_back</span>
</div>
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1">Create Courier Profile</h2>
</div>
<!-- PageIndicators -->
<div class="flex w-full flex-row items-center justify-center gap-3 py-5 px-4">
<div class="h-1 flex-1 rounded-full bg-primary"></div>
<div class="h-1 flex-1 rounded-full bg-slate-300 dark:bg-slate-700"></div>
<div class="h-1 flex-1 rounded-full bg-slate-300 dark:bg-slate-700"></div>
</div>
<!-- Step 1: Personal Details -->
<div class="flex flex-col px-4">
<!-- HeadlineText -->
<h1 class="text-slate-900 dark:text-white tracking-light text-[32px] font-bold leading-tight text-left pb-1 pt-4">Personal Details</h1>
<!-- BodyText -->
<p class="text-slate-600 dark:text-slate-300 text-base font-normal leading-normal pb-6 pt-1">Let's start with the basics. Please provide your personal information.</p>
<!-- EmptyState for Photo Upload -->
<div class="flex flex-col mb-6">
<div class="flex flex-col items-center gap-4 rounded-xl border-2 border-dashed border-slate-300 dark:border-slate-700 px-6 py-8">
<div class="flex size-16 items-center justify-center rounded-full bg-primary/10">
<span class="material-symbols-outlined text-primary !text-3xl">add_a_photo</span>
</div>
<div class="flex max-w-[480px] flex-col items-center gap-2">
<p class="text-slate-900 dark:text-white text-base font-bold leading-tight tracking-[-0.015em] max-w-[480px] text-center">Upload Profile Photo</p>
<p class="text-slate-500 dark:text-slate-400 text-sm font-normal leading-normal max-w-[480px] text-center">Tap here to upload a clear photo of yourself.</p>
</div>
</div>
</div>
<!-- Text Input Fields -->
<div class="flex flex-col gap-4">
<div>
<label class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-300" for="full-name">Full Name</label>
<input class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 p-3 text-sm text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:border-primary focus:ring-primary" id="full-name" placeholder="As it appears on your ID" type="text"/>
</div>
<div>
<label class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-300" for="national-id">National ID / Passport Number</label>
<input class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 p-3 text-sm text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:border-primary focus:ring-primary" id="national-id" placeholder="Enter your ID number" type="text"/>
</div>
</div>
</div>
<!-- Spacer -->
<div class="flex-grow"></div>
<!-- Actions -->
<div class="sticky bottom-0 bg-background-light dark:bg-background-dark p-4 pt-6">
<div class="flex flex-col items-center gap-4">
<!-- Primary CTA Button -->
<button class="flex w-full min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-12 px-4 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] shadow-lg shadow-primary/30">
<span class="truncate">Next: Contact Info</span>
</button>
<!-- Secondary Link -->
<p class="text-sm">
<span class="text-slate-500 dark:text-slate-400">Already have an account?</span>
<a class="font-bold text-primary" href="#">Sign In</a>
</p>
</div>
</div>
</div>
</body></html>
